[package]
name = "trustexam-desktop"
description = "TrustExam candidate app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "trustexam_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Forces the scripted mock platform (Linux CI and UI development).
mock = []

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
te-platform-mock.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
te-platform-windows.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
te-platform-macos.workspace = true

[lints]
workspace = true
