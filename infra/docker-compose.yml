# Local development stack. Credentials here are for local use only.
name: trustexam

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trustexam
      POSTGRES_PASSWORD: trustexam
      POSTGRES_DB: trustexam
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustexam -d trustexam"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible object storage (stand-in for AWS S3 / any S3 provider). See docs/adr/0001.
  s3:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports: ["127.0.0.1:9000:8333"]
    volumes:
      - s3-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 3s
      retries: 60

  s3-init:
    image: amazon/aws-cli:2.31.0
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: trustexam
      AWS_SECRET_ACCESS_KEY: trustexam-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        aws --endpoint-url http://s3:8333 s3api head-bucket --bucket trustexam-evidence ||
        aws --endpoint-url http://s3:8333 s3api create-bucket --bucket trustexam-evidence
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  s3-data:
